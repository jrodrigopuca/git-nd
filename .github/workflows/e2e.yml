# Browser E2E (Playwright), ON DEMAND only: the "Run workflow" button.
# They never run by themselves — CI on every push is ci.yml (unit/service/HTTP).
# Locally: `pnpm e2e` (uses the installed Google Chrome; nothing to download).
name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The E2E build their repos with the git CLI (the app itself never needs it).
      - run: |
          git config --global user.name "git-nd CI"
          git config --global user.email "ci@git-nd.invalid"
          git config --global init.defaultBranch main

      # GitHub's Ubuntu runners ship Google Chrome, which playwright.config.js uses.
      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
